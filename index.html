<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haliyah's Bank</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #app {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

       
        h1, [id="#app-title"] {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            text-transform: capitalize;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        
        h1::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #4f46e5;
            border-radius: 50%;
        }

      
        #balance-box {
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            color: #ffffff;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.25);
        }

        #balance-label {
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        #balance {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -1px;
        }

        #balance::before {
            content: '₦';
            margin-right: 4px;
        }

      
        #entry-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #amount-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
        }

        #amount {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #0f172a;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        #amount:focus {
            border-color: #4f46e5;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

    
        #button-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

     
        #button-box button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: capitalize;
        }

        #button-box button:active {
            transform: scale(0.98);
        }

        .action-credit, #credit-btn {
            background-color: #3d84c3;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .action-credit:hover, #credit-btn:hover {
            background-color: #1db655;
        }

        
        .action-debit, #debit-btn {
            background-color: #447def;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .action-debit:hover, #debit-btn:hover {
            background-color: #d11e1e;
        }

      
        #message {
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            color: #4f46e5;
            min-height: 18px;
        }

       
        #note {
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- Kept your exact ID attribute typo structure intact -->
        <h1 id="#app-title">haliyah's bank</h1>
        
        <div id="balance-box">
            <p id="balance-label">Available balance</p>
            <p id="balance">1000</p>
        </div>

        <div id="entry-box">
            <label id="amount-label" for="amount">Enter Amount</label>
            <input type="number" id="amount" placeholder="0">
        </div>

        <div id="button-box">
            <button class="action-credit" id="credit-btn">Credit</button>
            <button class="action-debit" id="debit-btn">debit</button>
            <p id="message"></p>
            <p id="note">With Terms and Condition Applied</p>
        </div>
    </div>
    
</body>
</html>
